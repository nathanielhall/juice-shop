name: CodeMender Findings Pull Request (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      diff_base:
        description: "Base Git ref to diff against (e.g. HEAD~1 or origin/main)"
        required: false
        default: "HEAD~1"

env:
  PROJECT_ID: "codemender-nathanielhall"
  REGION: "us-east4"
  JOB_NAME: "codemender-runner"
  TRANSIT_BUCKET: "gs://codemender-reports-codemender-nathanielhall"
  PR_BRANCH: "security/nightly-scan-report"
  # Set to "true" to skip project compilation inside the container if language toolchains aren't installed
  BUILD_COMMAND: "true"

jobs:
  codemender-scan:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Stage Payload & Manifest to GCS
        id: stage-gcs
        run: |
          set -euo pipefail
          COMMIT_SHA=$(git rev-parse HEAD)
          DIFF_BASE="${{ github.event.inputs.diff_base || 'HEAD~1' }}"

          TARGET_GCS_PREFIX="${TRANSIT_BUCKET}/${GITHUB_REPOSITORY}/branches/${PR_BRANCH}/${COMMIT_SHA}"
          BRANCH_LATEST_PREFIX="${TRANSIT_BUCKET}/${GITHUB_REPOSITORY}/branches/${PR_BRANCH}/latest"
          FIND_OUTPUT_URI="${TARGET_GCS_PREFIX}/find-diff/output"
          MANIFEST_URI="${TARGET_GCS_PREFIX}/find-diff/manifest.json"

          # 1. Package repository (including .git history for diff base resolution)
          tar --exclude='./gha-creds-*.json' -czf /tmp/code.tar.gz .
          gcloud storage cp /tmp/code.tar.gz "${TARGET_GCS_PREFIX}/shared/code.tar.gz"
          gcloud storage cp /tmp/code.tar.gz "${BRANCH_LATEST_PREFIX}/shared/code.tar.gz"

          # 2. Create and upload find-diff manifest.json
          cat <<EOF > /tmp/manifest-find-diff.json
          {
            "command": "find-diff",
            "payload_uri": "${TARGET_GCS_PREFIX}/shared/code.tar.gz",
            "output_uri": "${FIND_OUTPUT_URI}",
            "diff_base": "${DIFF_BASE}",
            "diff_workers": 4,
            "log_level": "info"
          }
          EOF
          gcloud storage cp /tmp/manifest-find-diff.json "${MANIFEST_URI}"

          echo "manifest_uri=${MANIFEST_URI}" >> "$GITHUB_OUTPUT"
          echo "output_uri=${FIND_OUTPUT_URI}" >> "$GITHUB_OUTPUT"
          echo "branch_latest_prefix=${BRANCH_LATEST_PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Trigger Cloud Run Job (find-diff)
        run: |
          gcloud run jobs execute "${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait \
            --update-env-vars="MANIFEST_URI=${{ steps.stage-gcs.outputs.manifest_uri }},OUTPUT_URI=${{ steps.stage-gcs.outputs.output_uri }},CODEMENDER_BUILD_COMMAND=${BUILD_COMMAND},CODEMENDER_SANDBOX_ENABLED=false"

      - name: Download Scan Report & Stage Findings for ChatOps
        run: |
          set -euo pipefail
          OUTPUT_URI="${{ steps.stage-gcs.outputs.output_uri }}"
          BRANCH_LATEST_PREFIX="${{ steps.stage-gcs.outputs.branch_latest_prefix }}"

          # Download report.md and findings.json generated by Cloud Run
          gcloud storage cp "${OUTPUT_URI}/report.md" ./codemender_summary.md
          gcloud storage cp "${OUTPUT_URI}/findings.json" /tmp/findings.json

          # Copy findings.json to branch-level 'latest' prefix so ChatOps can always find it
          gcloud storage cp /tmp/findings.json "${BRANCH_LATEST_PREFIX}/find-diff/output/findings.json"

          # Append a ChatOps quick-reference table with finding IDs to the Markdown report
          cat << 'EOF' >> codemender_summary.md

          ---
          ### 💬 CodeMender ChatOps Commands
          Comment on this Pull Request using the Finding ID or Index below:
          - **Verify exploitability:** `/verify <finding_id>`
          - **Generate & commit fix:** `/fix <finding_id>`

          | Index | Finding ID | Rule ID | Location | ChatOps Commands |
          | :--- | :--- | :--- | :--- | :--- |
          EOF

          jq -r '
            .runs[0].results // [] | to_entries[] |
            .key as $idx |
            (.value.properties.finding_id // .value.properties.id // ($idx | tostring)) as $fid |
            (.value.ruleId // "N/A") as $rule |
            (.value.locations[0].physicalLocation.artifactLocation.uri // "unknown") as $file |
            (.value.locations[0].physicalLocation.region.startLine // 0 | tostring) as $line |
            "| `\($idx)` | `\($fid)` | `\($rule)` | `\($file):\($line)` | `/verify \($fid)` <br> `/fix \($fid)` |"
          ' /tmp/findings.json >> codemender_summary.md

      - name: Clean Up Temporary Workspace Files
        if: always()
        run: |
          rm -f gha-creds-*.json

      - name: Create Tracking Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: add CodeMender security scan report"
          branch: ${{ env.PR_BRANCH }}
          delete-branch: true
          title: "🔒 CodeMender Security Scan Findings"
          body-path: codemender_summary.md
