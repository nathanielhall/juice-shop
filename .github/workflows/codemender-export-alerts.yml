name: CodeMender Scan (export GitHub Code Scanning)
on:
  # Trigger manually via the GitHub Actions UI
  workflow_dispatch:

jobs:
  codemender-scan:
    runs-on: ubuntu-22.04

    permissions:
      contents: write
      pull-requests: write
      id-token: write
      security-events: write
      actions: read

    steps:
      # Checkout the TARGET repository
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Authenticate to Google Cloud securely
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.WIF_PROVIDER }}"
          service_account: "${{ secrets.WIF_SERVICE_ACCOUNT }}"

      # Set up the gcloud CLI
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Download and Install CodeMender On-The-Fly
      - name: Install CodeMender CLI
        run: |
          echo "Downloading CodeMender from Artifact Registry..."
          gcloud artifacts generic download \
            --project=cmoc-prod \
            --location=us \
            --repository=codemender-cli-production \
            --package=cm \
            --version=stable \
            --name=cm-linux-amd64.zip \
            --destination=./
            
          unzip -q cm-linux-amd64.zip
          chmod +x cm
          sudo mv cm /usr/local/bin/cm
          cm init

      # Configure Git Identity for the Bot
      - name: Configure Git Identity
        run: |
          git config --global user.name "CodeMender Scan Bot"
          git config --global user.email "codemender-bot@google.com"

      - name: Update config.yaml with file types
        shell: python
        run: |
          import os
          import yaml
    
          config_file = os.path.expanduser('~/.codemender/config.yaml')
            
          # 1. Discover all unique file extensions, excluding .git
          extensions = set()
          for root, _, files in os.walk('.'):
              if '.git' in root:
                  continue
              for file in files:
                  _, ext = os.path.splitext(file)
                  if ext:
                      extensions.add(ext)
    
          # 2. Load existing config
          if os.path.exists(config_file):
              with open(config_file, 'r') as f:
                  config = yaml.safe_load(f) or {}
          else:
              print("Config not found")
              config = {}
    
          # Ensure nested keys exist safely
          config.setdefault('scan', {}).setdefault('extensions', {})
          list_key = 'include'
          if list_key not in config['scan']['extensions'] or config['scan']['extensions'][list_key] is None:
              config['scan']['extensions'][list_key] = []
    
          # 3. Add new extensions
          for ext in sorted(extensions):
              if ext not in config['scan']['extensions'][list_key]:
                  config['scan']['extensions'][list_key].append(ext)
    
          # Disable interactive prompts for CI/CD execution
          config.setdefault('tools', {})
          config['tools']['confirm_commands'] = False
          config['tools']['confirm_writes'] = False

          # 4. Write back
          with open(config_file, 'w') as f:
              yaml.dump(config, f, default_flow_style=False)
          print(f"Updated {config_file} with {len(config['scan']['extensions'][list_key])} extensions.")

      - name: Find
        run: |
          set -o pipefail
          cm find . -y 2>&1 | tee scan_output.log

      # Generate and Publish the Report
      - name: Generate Security Report
        run: |
          echo "📊 Generating Markdown and JSON reports..."
          cm report --format md > codemender_summary.md

          # Export open CRITICAL and HIGH findings so GitHub Security Overview shows multi-severity breakdown
          # (Change to --severity CRITICAL if you only want Critical findings)
          cm report --severity CRITICAL,HIGH --status OPEN --format json > codemender_report.json

          # Extract the execution and token usage line from the scan log
          TOKEN_SUMMARY=$(grep "Tokens:" scan_output.log | tail -n 1 || true)

          # If the token summary was found, inject it at the top of the GitHub Step Summary
          if [ -n "$TOKEN_SUMMARY" ]; then
            echo "### 🪙 Execution & Token Usage" >> $GITHUB_STEP_SUMMARY
            echo "> $TOKEN_SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
          fi

          echo "# CodeMender Scan Results" >> $GITHUB_STEP_SUMMARY
          cat codemender_summary.md >> $GITHUB_STEP_SUMMARY

      - name: Format SARIF Report for GitHub UI
        run: |
          python3 -c '
          import json, re, os

          # GitHub input variable to extract relative path dynamically
          repo_name = "${{ github.repository }}"
          repo_short_name = repo_name.split("/")[-1]
          workspace = os.environ.get("GITHUB_WORKSPACE", "")

          # Load JSON export
          with open("codemender_report.json", "r") as f:
              findings = json.load(f)

          rules = []
          results = []
          seen_rules = set()
      
          # 1. Map CodeMender severity to SARIF level (error, warning, note)
          severity_to_level = {
              "CRITICAL": "error",
              "HIGH": "error",
              "MEDIUM": "warning",
              "LOW": "note",
              "INFO": "note"
          }

          # 2. Map CodeMender severity to GitHub numeric security-severity (CVSS 0.0-10.0)
          # GitHub mapping: >=9.0 = Critical, 7.0-8.9 = High, 4.0-6.9 = Medium, 0.1-3.9 = Low
          severity_to_ghas_score = {
              "CRITICAL": "9.5",
              "HIGH": "7.5",
              "MEDIUM": "5.5",
              "LOW": "2.5",
              "INFO": "1.0"
          }

          # 3. Map CodeMender severity to precision
          severity_to_precision = {
              "CRITICAL": "very-high",
              "HIGH": "high",
              "MEDIUM": "medium",
              "LOW": "low",
              "INFO": "low"
          }

          for finding in findings:
              title = finding.get("title", "Unknown-Rule").strip()
              raw_severity = finding.get("severity", "MEDIUM").upper()
              analysis = finding.get("analysis", "")
              finding_status = str(finding.get("status", "OPEN")).upper()

              # Skip findings already marked FIXED or DISMISSED in CodeMender state if any
              if finding_status in ("FIXED", "DISMISSED", "CLOSED"):
                  continue

              # Create a stable, clean rule ID (include severity so rules with same title do not collide on score)
              slug = re.sub(r"[^a-zA-Z0-9_-]+", "-", title).strip("-")[:80]
              rule_id = f"CM-{raw_severity}-{slug}" if slug else f"CM-{raw_severity}-Finding"

              level = severity_to_level.get(raw_severity, "warning")
              ghas_score = severity_to_ghas_score.get(raw_severity, "5.5")
              precision = severity_to_precision.get(raw_severity, "medium")

              # Normalize file_path to clean repository-relative path
              file_path = finding.get("file_path", "unknown")
              relative_path = file_path
              if workspace and relative_path.startswith(workspace):
                  relative_path = relative_path[len(workspace):]
              elif "/home/runner/work/" in relative_path and repo_short_name in relative_path:
                  relative_path = relative_path.split(repo_short_name + "/")[-1]
              if repo_short_name and relative_path.startswith(repo_short_name + "/"):
                  relative_path = relative_path[len(repo_short_name + "/"):]
              relative_path = relative_path.lstrip("./").lstrip("/") or "unknown"

              # Extract any CWE references from title or analysis to enrich GitHub SAST category tables
              tags = ["security", "codemender", f"severity/{raw_severity.lower()}"]
              cwe_matches = re.findall(r"CWE-\d+", f"{title} {analysis}", re.IGNORECASE)
              for cwe in cwe_matches:
                  cwe_tag = f"external/cwe/{cwe.lower()}"
                  if cwe_tag not in tags:
                      tags.append(cwe_tag)

              # Populate Rules Array with GitHub Code Scanning required security properties
              if rule_id not in seen_rules:
                  rules.append({
                      "id": rule_id,
                      "name": title,
                      "shortDescription": {
                          "text": title
                      },
                      "fullDescription": {
                          "text": analysis[:1000] if analysis else title
                      },
                      "defaultConfiguration": {
                          "level": level
                      },
                      "help": {
                          "text": f"{title}\n\n{analysis}",
                          "markdown": f"### {title}\n\n**Severity:** `{raw_severity}`\n\n{analysis}"
                      },
                      "properties": {
                          "tags": tags,
                          "precision": precision,
                          "problem.severity": level,
                          "security-severity": ghas_score
                      }
                  })
                  seen_rules.add(rule_id)

              start_line = max(1, int(finding.get("start_line") or 1))
              end_line = max(start_line, int(finding.get("end_line") or start_line))

              # Populate Results Array
              results.append({
                  "ruleId": rule_id,
                  "level": level,
                  "message": {
                      "text": f"[{raw_severity}] {title}: {analysis}"
                  },
                  "locations": [
                      {
                          "physicalLocation": {
                              "artifactLocation": {
                                  "uri": relative_path,
                                  "uriBaseId": "%SRCROOT%"
                              },
                              "region": {
                                  "startLine": start_line,
                                  "endLine": end_line
                              }
                          }
                      }
                  ]
              })

          # Construct Final SARIF Structure
          sarif_output = {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [
                  {
                      "tool": {
                          "driver": {
                              "name": "CodeMender",
                              "informationUri": "https://cloud.google.com/gemini-enterprise-agent-platform",
                              "version": "0.15.0",
                              "rules": rules
                          }
                      },
                      "results": results
                  }
              ]
          }

          with open("output.sarif", "w") as f:
              json.dump(sarif_output, f, indent=2)
          print(f"Generated output.sarif with {len(rules)} rules and {len(results)} security results.")
          '

      # Upload the SARIF payload directly to the target repository using the GitHub CLI
      - name: Upload SARIF directly via GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Compress the SARIF file into GZIP Base64 file (avoids bash argument length limits)
          gzip -c "output.sarif" | base64 -w 0 > sarif.b64
          
          # 2. Extract the exact commit hash of the checked-out codebase
          COMMIT_SHA=$(git rev-parse HEAD)
          
          # 3. Safely resolve the active branch reference name
          BRANCH_REF="${GITHUB_REF:-$(git symbolic-ref HEAD 2>/dev/null || echo 'refs/heads/main')}"
          
          echo "Uploading SARIF payload natively to ${{ github.repository }} (ref: $BRANCH_REF, sha: $COMMIT_SHA)..."
          
          # 4. Execute the secure POST request directly through the GH CLI engine using @file syntax
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ github.repository }}/code-scanning/sarifs" \
            -f commit_sha="$COMMIT_SHA" \
            -f ref="$BRANCH_REF" \
            -F sarif=@sarif.b64 \
            -f tool_name="CodeMender"

      # Cleanup Sensitive Binaries (Best Practice)
      - name: Cleanup
        if: always()
        run: |
          rm -f cm-linux-amd64.zip
          rm -f cm
          rm -f output.sarif sarif.b64 codemender_report.json codemender_summary.md scan_output.log
          rm -rf .cm_project
          rm -rf .exploit/
          rm -f gha-creds-*.json
